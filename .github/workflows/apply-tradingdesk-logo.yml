name: Apply Trading Desk logo

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-logo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Replace old branding with tradingdesk.svg
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_css = '''.brand{display:flex;align-items:center;gap:12px}
          .brand .bx{width:38px;height:38px;border:1px solid var(--cyan);border-radius:9px;display:grid;place-items:center;background:var(--cyan-glow);box-shadow:0 0 18px var(--cyan-glow)}
          .brand .bt{font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:1.02rem;letter-spacing:.03em;line-height:1}
          .brand .bt small{display:block;font-family:var(--mono);font-weight:400;font-size:.54rem;letter-spacing:.28em;color:var(--faint);margin-top:3px}'''
          new_css = '''.brand{display:flex;align-items:center;line-height:0}
          .brand-logo{display:block;width:210px;max-width:min(52vw,210px);height:auto}
          footer .brand-logo{width:220px;max-width:min(70vw,220px)}'''

          old_nav = '''    <a class="brand" href="#top">
                <span class="bx"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><line x1="5" y1="2" x2="5" y2="18" stroke="#f87171" stroke-width="1.6"/><rect x="2.5" y="6" width="5" height="6" fill="#f87171"/><line x1="14" y1="2" x2="14" y2="18" stroke="#34d399" stroke-width="1.6"/><rect x="11.5" y="7" width="5" height="7" fill="#34d399"/></svg></span>
                <span class="bt">The Trading Desk<small>Structure over signals</small></span>
              </a>'''
          new_nav = '''    <a class="brand" href="#top" aria-label="The Trading Desk home">
                <img class="brand-logo" src="tradingdesk.svg" alt="The Trading Desk — Structure Over Signals">
              </a>'''

          old_footer = '''    <a class="brand" href="#top"><span class="bx"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><line x1="5" y1="2" x2="5" y2="18" stroke="#f87171" stroke-width="1.6"/><rect x="2.5" y="6" width="5" height="6" fill="#f87171"/><line x1="14" y1="2" x2="14" y2="18" stroke="#34d399" stroke-width="1.6"/><rect x="11.5" y="7" width="5" height="7" fill="#34d399"/></svg></span><span class="bt">The Trading Desk<small>thetradingdesk.org</small></span></a>'''
          new_footer = '''    <a class="brand" href="#top" aria-label="The Trading Desk home"><img class="brand-logo" src="tradingdesk.svg" alt="The Trading Desk — Structure Over Signals"></a>'''

          for old, new, label in [
              (old_css, new_css, 'brand CSS'),
              (old_nav, new_nav, 'navigation brand'),
              (old_footer, new_footer, 'footer brand'),
          ]:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one {label}; found {text.count(old)}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

          grep -q 'src="tradingdesk.svg"' index.html
          test "$(grep -o 'src="tradingdesk.svg"' index.html | wc -l)" -eq 2
          git diff --check -- index.html

      - name: Commit requested logo swap
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          git rm -- brand-logo.svg .github/workflows/apply-tradingdesk-logo.yml
          git commit -m "Replace site branding with new Trading Desk logo"
          git push origin HEAD:main
