name: Apply Trading Desk hero logo

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace hero branding with logo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = '''        <div class="hero-badge"><span class="hb-dot"></span> LIVE TERMINAL · EDUCATIONAL ONLY</div>\n        <h1 class="disp hero-title">The Trading <span class="ht-desk">Desk</span></h1>\n        <p class="hero-tag">Structure over signals</p>'''
          new = '''        <div class="hero-logo-stage">\n          <img class="hero-logo-massive" src="tradingdesk.svg" alt="The Trading Desk — Structure Over Signals">\n        </div>'''

          if old not in text:
              raise SystemExit('Expected hero branding block was not found; refusing partial edit.')
          text = text.replace(old, new, 1)

          css = '''\n/* Main hero brand lockup */\n.hero-logo-stage{\n  width:100%;\n  display:flex;\n  justify-content:center;\n  align-items:center;\n  margin:0 auto 22px;\n}\n.hero-logo-massive{\n  display:block;\n  width:min(1080px,96vw);\n  max-width:none;\n  height:auto;\n  filter:drop-shadow(0 0 28px rgba(34,211,238,.16));\n}\n@media(max-width:640px){\n  .hero-logo-stage{margin-bottom:16px;}\n  .hero-logo-massive{width:min(760px,98vw);}\n}\n'''
          if '.hero-logo-massive{' not in text:
              text = text.replace('</style>', css + '\n</style>', 1)

          path.write_text(text, encoding='utf-8')
          PY

          grep -Fq 'class="hero-logo-massive" src="tradingdesk.svg"' index.html
          ! grep -Fq 'LIVE TERMINAL · EDUCATIONAL ONLY' index.html
          git diff --check -- index.html

      - name: Commit hero update and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          git rm -- .github/workflows/apply-hero-logo.yml
          git commit -m "Use Trading Desk logo as hero branding"
          git push origin HEAD:main
