<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Trading Desk — The All-In-One Trading Terminal</title>
<meta name="description" content="A free, all-in-one terminal for traders.">
<meta name="theme-color" content="#070a0f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cline x1='5' y1='2' x2='5' y2='18' stroke='%23f87171' stroke-width='1.6'/%3E%3Crect x='2.5' y='6' width='5' height='6' fill='%23f87171'/%3E%3Cline x1='14' y1='2' x2='14' y2='18' stroke='%2334d399' stroke-width='1.6'/%3E%3Crect x='11.5' y='7' width='5' height='7' fill='%2334d399'/%3E%3C/svg%3E">
<style>
:root{
  --void:#070a0f; --bg-2:#0b0f16; --panel:#0d1117; --panel-2:#131a24; --panel-3:#1a2330;
  --line:rgba(126,166,214,.12); --line-2:rgba(126,166,214,.06);
  --text:#e8eef7; --dim:#8a94a6; --faint:#586173;
  --cyan:#22d3ee; --cyan-dim:#0e7490; --cyan-glow:rgba(34,211,238,.26);
  --gold:#f5b942; --gold-glow:rgba(245,185,66,.22);
  --brass:#d9a441; --brass-glow:rgba(217,164,65,.2);
  --ledger:#e0d5bd; --ledger-glow:rgba(224,213,189,.16);
  --green:#34d399; --green-bg:rgba(52,211,153,.12);
  --red:#f87171; --red-bg:rgba(248,113,113,.12);
  --violet:#0ea5e9; --violet-bg:rgba(14,165,233,.14);
  --disp:'Chakra Petch',sans-serif;
  --body:'IBM Plex Sans',sans-serif;
  --mono:'IBM Plex Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--void);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
::selection{background:var(--cyan);color:var(--void)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.wrap{width:min(1280px,92%);margin:0 auto}
.mono{font-family:var(--mono)}
.disp{font-family:var(--disp);font-weight:700;letter-spacing:-.01em;line-height:.98}
.up{color:var(--green)} .dn{color:var(--red)}
.eyebrow{font-family:var(--mono);font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;color:var(--cyan);display:flex;align-items:center;gap:12px}
.eyebrow::before{content:"";width:24px;height:1px;background:var(--cyan)}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s cubic-bezier(.16,.8,.3,1),transform .7s cubic-bezier(.16,.8,.3,1)}
.reveal.in{opacity:1;transform:none}
.hidden{display:none!important}

/* ambient background */
.bg-fx{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.bg-grid{position:absolute;inset:-50%;background-image:linear-gradient(var(--line-2) 1px,transparent 1px),linear-gradient(90deg,var(--line-2) 1px,transparent 1px);background-size:70px 70px;opacity:.55;animation:drift 30s linear infinite}
.bg-glow{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(130px);opacity:.14}
.g-cyan{background:radial-gradient(circle,var(--cyan) 0%,transparent 70%);top:-24vmax;left:-14vmax;animation:floatA 34s ease-in-out infinite}
.g-gold{background:radial-gradient(circle,var(--gold) 0%,transparent 70%);bottom:-26vmax;right:-16vmax;animation:floatB 40s ease-in-out infinite}
.g-violet{background:radial-gradient(circle,var(--violet) 0%,transparent 70%);top:40%;left:55%;width:40vmax;height:40vmax;opacity:.08;animation:floatA 46s ease-in-out infinite}
@keyframes drift{to{transform:translate(70px,70px)}}
@keyframes floatA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(7vmax,5vmax) scale(1.12)}}
@keyframes floatB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-6vmax,-6vmax) scale(1.14)}}

/* ticker tape */
.tape{border-bottom:1px solid var(--line);background:var(--bg-2);overflow:hidden;white-space:nowrap;position:relative}
.tape-track{display:inline-flex;padding:8px 0;animation:tape 60s linear infinite;will-change:transform}
.tape:hover .tape-track{animation-play-state:paused}
@keyframes tape{to{transform:translateX(-50%)}}
.tape i{font-style:normal;font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;color:var(--dim);padding:0 20px;border-right:1px solid var(--line-2);display:inline-flex;gap:8px;align-items:center}
.tape i b{color:var(--text);font-weight:600}

/* nav */
#nav{position:sticky;top:0;z-index:80;background:rgba(7,10,15,.86);backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0}
.brand{display:flex;align-items:center;gap:12px}
.brand .bx{width:38px;height:38px;border:1px solid var(--cyan);border-radius:9px;display:grid;place-items:center;background:var(--cyan-glow);box-shadow:0 0 18px var(--cyan-glow)}
.brand .bt{font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:1.02rem;letter-spacing:.03em;line-height:1}
.brand .bt small{display:block;font-family:var(--mono);font-weight:400;font-size:.54rem;letter-spacing:.28em;color:var(--faint);margin-top:3px}
.nav-links{display:flex;align-items:center;gap:24px;list-style:none}
.nav-links a{font-family:var(--mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);transition:color .2s}
.nav-links a:hover{color:var(--cyan)}
.nav-cmd{display:none;align-items:center;gap:8px;font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:8px 12px;transition:border-color .2s}
.nav-cmd:hover{border-color:var(--cyan);color:var(--cyan)}
.nav-cmd kbd{border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-family:var(--mono);color:var(--dim)}
@media(min-width:1080px){.nav-cmd{display:inline-flex}}
.menu-btn{display:none;border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
@media(max-width:960px){
  .nav-links{position:fixed;inset:64px 14px auto 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;flex-direction:column;align-items:stretch;padding:18px;gap:14px;display:none;box-shadow:0 30px 60px rgba(0,0,0,.7)}
  .nav-links.open{display:flex}
  .menu-btn{display:block}
}

/* hero */
header{position:relative;padding:72px 0 40px;border-bottom:1px solid var(--line)}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:46px;align-items:center}
.hero .badge{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line);border-radius:100px;padding:7px 14px;margin-bottom:24px;background:rgba(13,17,23,.6)}
.hero .badge b{color:var(--gold);font-weight:600}
.hero h1{font-size:clamp(2.6rem,6vw,4.6rem)}
.hero h1 .c{color:var(--cyan);text-shadow:0 0 30px var(--cyan-glow)}
.hero .sub{font-size:clamp(1.02rem,1.9vw,1.2rem);color:var(--dim);max-width:560px;margin:22px 0 10px}
.hero .sub b{color:var(--text);font-weight:600}
.hero .micro{font-family:var(--mono);font-size:.7rem;color:var(--faint);letter-spacing:.04em;margin-bottom:28px}
.cta-row{display:flex;gap:12px;flex-wrap:wrap}

/* ---- the wire, inside the command center ---- */
.wire-head{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);align-items:center}
.wire-head span:first-child{display:flex;align-items:center;gap:6px;color:var(--gold)}
